name: Ping IndexNow after deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  indexnow:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Wait for Cloudflare Workers deployment
        if: github.event_name == 'push'
        run: sleep 90

      - name: Submit all URLs to IndexNow (Bing, ChatGPT Search, Yandex)
        run: npm run ping-indexnow
